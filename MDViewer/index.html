<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Viewer</title>
<link id="hl-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link id="hl-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css" disabled>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --bg: #1f1f1e;
    --panel: #262625;
    --rail: #181817;
    --hover: #30302e;
    --active: #3a3a38;
    --text: #e8e6e1;
    --muted: #9a9892;
    --border: #3a3a38;
    --link: #7ab7ff;
    --code-bg: #282c34;
    --code-head: #21252b;
    --inline-code: #f0a98a;
    --inline-code-bg: #333331;
  }
  [data-theme="light"] {
    --bg: #faf9f5;
    --panel: #f0eee6;
    --rail: #e6e3d8;
    --hover: #e6e3d8;
    --active: #d9d5c7;
    --text: #1f1f1e;
    --muted: #6b6a64;
    --border: #ddd9cc;
    --link: #1a66cc;
    --code-bg: #fafafa;
    --code-head: #f0eee6;
    --inline-code: #c2410c;
    --inline-code-bg: #ece9df;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body {
    display: flex; overflow: hidden;
    font: 16px/1.7 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- left rail (icon bar) ---------- */
  #rail {
    width: 44px; flex: none; background: var(--rail);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
  }
  #rail .spacer { flex: 1; }
  .ib {
    width: 34px; height: 34px; padding: 0; display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer;
  }
  .ib:hover { background: var(--hover); color: var(--text); }
  .ib.on { color: var(--text); background: var(--active); }
  .ib:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  .ib svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- explorer panel ---------- */
  #explorer {
    width: 260px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0; position: relative;
  }
  #explorer.hidden { display: none; }
  #exp-title {
    padding: 10px 12px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #exp-head { display: flex; align-items: center; padding-right: 6px; }
  #exp-head #exp-title { flex: 1; min-width: 0; }
  #b-refresh { width: 26px; height: 26px; font-size: 15px; }
  #tree { flex: 1; overflow: auto; padding: 2px 0 12px; font-size: 13.5px; line-height: 1.4; user-select: none; }
  #tree .empty { padding: 10px 14px; color: var(--muted); }
  #tree .empty a { color: var(--link); cursor: pointer; }
  .row {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px 3px 0; cursor: pointer;
    white-space: nowrap; overflow: hidden;
  }
  .row:hover { background: var(--hover); }
  .row.active { background: var(--active); }
  .row .chev { width: 14px; flex: none; text-align: center; color: var(--muted); font-size: 10px; transition: transform .1s; }
  .row.open > .chev { transform: rotate(90deg); }
  .row .ico { flex: none; width: 16px; text-align: center; font-size: 13px; }
  .row .lbl { overflow: hidden; text-overflow: ellipsis; }
  #resizer { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 3; }
  #resizer:hover, #resizer.drag { background: var(--link); opacity: .4; }

  /* ---------- right rail + timer ---------- */
  #rail-r {
    width: 44px; flex: none; background: var(--rail); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0;
  }
  #b-timer { height: auto; min-height: 34px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; padding: 6px 0; }
  #mini { font-size: 10px; line-height: 1; color: var(--link); font-variant-numeric: tabular-nums; }
  #mini:empty { display: none; }
  #timerpanel {
    width: 230px; flex: none; background: var(--panel); border-left: 1px solid var(--border);
    padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; overflow: auto;
  }
  #timerpanel.hidden { display: none; }
  #timerpanel .tabs { display: flex; background: var(--rail); border-radius: 8px; padding: 3px; gap: 3px; }
  #timerpanel button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #timerpanel button:hover { background: var(--hover); }
  #timerpanel .tabs button { flex: 1; background: transparent; border: 0; color: var(--muted); }
  #timerpanel .tabs button.on { background: var(--active); color: var(--text); }
  #tdisp { font-size: 40px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; padding: 8px 0; }
  #tdisp.done { color: #ef6a5b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .btnrow { display: flex; gap: 8px; }
  .btnrow button { flex: 1; }
  #tstart { background: var(--link) !important; color: #fff !important; border-color: transparent !important; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 4px 10px !important; font-size: 12px !important; }
  .chips button.on { background: var(--active) !important; border-color: var(--link) !important; }
  .custom { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .custom input {
    width: 64px; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px;
  }
  #tlabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* ---------- floating timer ---------- */
  #float {
    position: fixed; top: 16px; right: 64px; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px;
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    cursor: grab; user-select: none; touch-action: none;
  }
  #float.hidden { display: none; }
  #float .fl { font-size: 10px; line-height: 1.1; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  #float .ft { font-size: 22px; line-height: 1.1; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  #float.done .ft { color: #ef6a5b; animation: pulse 1s ease-in-out infinite; }
  #float .fb {
    width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%;
    background: var(--active); color: var(--text); cursor: pointer; font-size: 12px;
  }
  #float .fb:hover { background: var(--hover); }

  /* ---------- main ---------- */
  #main { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
  #drop {
    margin: 12vh auto 0; max-width: 520px; padding: 48px 24px; text-align: center;
    border: 2px dashed var(--border); border-radius: 16px; color: var(--muted);
  }
  #drop strong { color: var(--text); display: block; font-size: 20px; margin-bottom: 8px; }
  body.dragging #drop { border-color: var(--link); color: var(--text); }
  body.dragging { outline: 3px dashed var(--link); outline-offset: -10px; }

  #out { max-width: 780px; margin: 0 auto; padding: 32px 20px 120px; display: none; }
  #out h1, #out h2, #out h3, #out h4 { line-height: 1.3; margin: 1.6em 0 .5em; font-weight: 650; }
  #out h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: .6em; }
  #out h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  #out h3 { font-size: 1.2em; }
  #out p, #out ul, #out ol, #out blockquote, #out table, #out pre { margin: 0 0 1em; }
  #out a { color: var(--link); text-decoration: none; }
  #out a:hover { text-decoration: underline; }
  #out ul, #out ol { padding-left: 1.6em; }
  #out li { margin: .25em 0; }
  #out blockquote { border-left: 3px solid var(--border); padding: 2px 16px; color: var(--muted); }
  #out hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  #out img { max-width: 100%; border-radius: 8px; }

  #out code { font: 0.88em/1.5 ui-monospace, "SF Mono", Consolas, "Cascadia Code", Menlo, monospace; }
  #out :not(pre) > code { background: var(--inline-code-bg); color: var(--inline-code); padding: .15em .4em; border-radius: 6px; }
  .codewrap { position: relative; margin: 0 0 1em; border-radius: 10px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); }
  .codewrap .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: var(--code-head); color: var(--muted);
    font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .codewrap .head button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .codewrap pre { margin: 0; overflow-x: auto; }
  .codewrap pre code.hljs { background: transparent; padding: 14px 16px; display: block; }

  #out table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
  #out th, #out td { border: 1px solid var(--border); padding: 8px 12px; }
  #out th { background: var(--panel); text-align: left; }
  #out tr:nth-child(even) td { background: rgba(127,127,127,.06); }
  #out input[type=checkbox] { margin-right: 6px; }
</style>
</head>
<body>
  <nav id="rail">
    <button class="ib on" id="b-explorer" title="Explorer (Ctrl+B)" aria-label="Toggle explorer">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </button>
    <button class="ib" id="b-file" title="Open file (Ctrl+O)" aria-label="Open file">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
    </button>
    <button class="ib" id="b-folder" title="Open folder (Ctrl+Shift+O)" aria-label="Open folder">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="ib" id="b-theme" title="Toggle dark / light" aria-label="Toggle theme"></button>
    <button class="ib" id="b-full" title="Fullscreen" aria-label="Toggle fullscreen"></button>
  </nav>

  <aside id="explorer">
    <div id="exp-head"><span id="exp-title">Explorer</span><button class="ib" id="b-refresh" title="Refresh folder" aria-label="Refresh folder">↻</button></div>
    <div id="tree"></div>
    <div id="resizer"></div>
  </aside>

  <main id="main">
    <div id="drop">
      <strong>Drop a .md file or a folder here</strong>
      or use the buttons on the left. You can also paste markdown with Ctrl+V.
    </div>
    <article id="out"></article>
  </main>

  <div id="float" class="hidden">
    <div>
      <div class="fl" id="flab">Focus</div>
      <div class="ft" id="ftime">30:00</div>
    </div>
    <button class="fb" id="fplay" title="Start / Pause">▶</button>
    <button class="fb" id="fpop" title="Pop out (stays on top of other apps)">⧉</button>
    <button class="fb" id="fx" title="Hide">✕</button>
  </div>

  <aside id="timerpanel" class="hidden">
    <div id="tlabel">Focus timer</div>
    <div class="tabs">
      <button id="tab-down" class="on">Countdown</button>
      <button id="tab-up">Stopwatch</button>
    </div>
    <div id="tdisp">30:00</div>
    <div class="btnrow">
      <button id="tstart">Start</button>
      <button id="treset">Reset</button>
    </div>
    <div class="btnrow">
      <button id="tfloat">Floating</button>
    </div>
    <div id="cdtools">
      <div class="chips" id="chips">
        <button data-m="15">15m</button>
        <button data-m="25">25m</button>
        <button data-m="30" class="on">30m</button>
        <button data-m="45">45m</button>
        <button data-m="60">60m</button>
      </div>
      <div class="custom" style="margin-top:12px">
        <span>Custom</span>
        <input id="cmin" type="number" min="1" max="600" placeholder="min">
        <button id="cset">Set</button>
      </div>
    </div>
  </aside>

  <nav id="rail-r">
    <button class="ib" id="b-timer" title="Focus timer" aria-label="Toggle timer">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
      <span id="mini"></span>
    </button>
  </nav>

  <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  <input id="dirfallback" type="file" webkitdirectory hidden>

<script>
  const $ = id => document.getElementById(id);
  const out = $('out'), drop = $('drop'), main = $('main'), tree = $('tree');
  const fileInput = $('file'), dirFallback = $('dirfallback');
  const explorer = $('explorer');

  marked.setOptions({ gfm: true, breaks: false });

  /* ================= theme ================= */
  const ICON_SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  const ICON_FS_IN = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_FS_OUT = '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';

  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $('hl-dark').disabled = t !== 'dark';
    $('hl-light').disabled = t !== 'light';
    $('b-theme').innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
    $('b-theme').title = t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    try { localStorage.setItem('mdv-theme', t); } catch (e) {}
  }
  let savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('mdv-theme') || 'dark'; } catch (e) {}
  applyTheme(savedTheme);
  $('b-theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  /* ================= fullscreen ================= */
  function syncFs() {
    const on = !!document.fullscreenElement;
    $('b-full').innerHTML = on ? ICON_FS_OUT : ICON_FS_IN;
    $('b-full').title = on ? 'Exit fullscreen' : 'Fullscreen';
  }
  $('b-full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };
  document.addEventListener('fullscreenchange', syncFs);
  syncFs();

  /* ================= explorer toggle + resize ================= */
  function toggleExplorer(force) {
    const hide = force === undefined ? !explorer.classList.contains('hidden') : !force;
    explorer.classList.toggle('hidden', hide);
    $('b-explorer').classList.toggle('on', !hide);
  }
  $('b-explorer').onclick = () => toggleExplorer();

  (() => {
    const rz = $('resizer');
    let startX, startW;
    rz.addEventListener('pointerdown', e => {
      startX = e.clientX; startW = explorer.offsetWidth;
      rz.setPointerCapture(e.pointerId); rz.classList.add('drag');
    });
    rz.addEventListener('pointermove', e => {
      if (!rz.classList.contains('drag')) return;
      explorer.style.width = Math.min(600, Math.max(160, startW + e.clientX - startX)) + 'px';
    });
    rz.addEventListener('pointerup', () => rz.classList.remove('drag'));
  })();

  /* ================= markdown rendering ================= */
  const MATH_RE = new RegExp(
    '(```[\\s\\S]*?```|~~~[\\s\\S]*?~~~|`[^`\\n]*`)' +
    '|\\$\\$([\\s\\S]+?)\\$\\$' +
    '|\\\\\\[([\\s\\S]+?)\\\\\\]' +
    '|(\\\\begin\\{(align\\*?|aligned|equation\\*?|gather\\*?|cases|array|[pbvBV]?matrix)\\}[\\s\\S]+?\\\\end\\{\\5\\})' +
    '|\\\\\\(([\\s\\S]+?)\\\\\\)' +
    '|\\$(?!\\s)((?:\\\\.|[^$\\\\\\n])+?)(?<!\\s)\\$(?!\\d)',
    'g'
  );

  function extractMath(text) {
    const store = [];
    const stash = (tex, display) => { store.push({ tex, display }); return 'MATHPH' + (store.length - 1) + 'X'; };
    const replaced = text.replace(MATH_RE, (m, code, dd, br, env, _e, par, inl) => {
      if (code) return m;
      if (dd !== undefined) return stash(dd, true);
      if (br !== undefined) return stash(br, true);
      if (env !== undefined) return stash(env, true);
      if (par !== undefined) return stash(par, false);
      if (inl !== undefined) return stash(inl, false);
      return m;
    });
    return { replaced, store };
  }

  function restoreMath(html, store) {
    return html.replace(/MATHPH(\d+)X/g, (m, i) => {
      const item = store[+i];
      if (!item) return m;
      try {
        return katex.renderToString(item.tex.trim(), { displayMode: item.display, throwOnError: false, strict: 'ignore' });
      } catch (e) {
        return '<code>' + item.tex.replace(/</g, '&lt;') + '</code>';
      }
    });
  }

  function render(text, name) {
    const { replaced, store } = extractMath(text);
    out.innerHTML = restoreMath(marked.parse(replaced), store);

    out.querySelectorAll('pre > code').forEach(code => {
      const pre = code.parentElement;
      const langClass = [...code.classList].find(c => c.startsWith('language-'));
      const lang = langClass ? langClass.replace('language-', '') : 'text';
      if (hljs.getLanguage(lang)) hljs.highlightElement(code);
      else code.classList.add('hljs');
      const wrap = document.createElement('div');
      wrap.className = 'codewrap';
      const head = document.createElement('div');
      head.className = 'head';
      const label = document.createElement('span');
      label.textContent = lang;
      const btn = document.createElement('button');
      btn.textContent = 'Copy';
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(code.innerText); btn.textContent = 'Copied'; }
        catch (e) { btn.textContent = 'Failed'; }
        setTimeout(() => (btn.textContent = 'Copy'), 1500);
      });
      head.append(label, btn);
      pre.replaceWith(wrap);
      wrap.append(head, pre);
    });

    out.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });

    drop.style.display = 'none';
    out.style.display = 'block';
    main.scrollTo(0, 0);
  }

  /* ================= file tree ================= */
  const isMd = n => /\.(md|markdown|mdown|mkd)$/i.test(n);
  const SKIP_DIRS = new Set(['node_modules', '.git', '.svn', '.hg', '__pycache__', '.venv', 'venv', 'dist', 'build']);
  const natural = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  let activeRow = null;

  async function showFile(getFile, name, row) {
    try {
      const f = await getFile();
      const text = await f.text();
      render(text, name);
      if (activeRow) activeRow.classList.remove('active');
      if (row) { row.classList.add('active'); activeRow = row; } else { activeRow = null; activePath = null; }
    } catch (e) {
      alert('Could not read ' + name);
    }
  }

  // node: {type:'dir'|'file', name, children?, getFile?}
  function sortNodes(list) {
    list.sort((a, b) => (a.type !== b.type ? (a.type === 'dir' ? -1 : 1) : natural.compare(a.name, b.name)));
    list.forEach(n => n.children && sortNodes(n.children));
  }

  // File System Access API scan; prunes folders without md files
  async function scanHandle(dirHandle) {
    const children = [];
    for await (const [name, h] of dirHandle.entries()) {
      if (h.kind === 'directory') {
        if (name.startsWith('.') || SKIP_DIRS.has(name)) continue;
        const sub = await scanHandle(h);
        if (sub.children.length) children.push(sub);
      } else if (isMd(name)) {
        children.push({ type: 'file', name, getFile: () => h.getFile() });
      }
    }
    return { type: 'dir', name: dirHandle.name, children };
  }

  // Fallback (webkitdirectory): build tree from relative paths
  function buildFromFiles(fileList) {
    const files = [...fileList].filter(f => isMd(f.name));
    const rootName = files.length ? files[0].webkitRelativePath.split('/')[0] : 'Folder';
    const root = { type: 'dir', name: rootName, children: [] };
    for (const f of files) {
      const parts = f.webkitRelativePath.split('/').slice(1);
      if (parts.some((p, i) => i < parts.length - 1 && (p.startsWith('.') || SKIP_DIRS.has(p)))) continue;
      let cur = root;
      parts.forEach((p, i) => {
        if (i === parts.length - 1) cur.children.push({ type: 'file', name: p, getFile: async () => f });
        else {
          let d = cur.children.find(c => c.type === 'dir' && c.name === p);
          if (!d) { d = { type: 'dir', name: p, children: [] }; cur.children.push(d); }
          cur = d;
        }
      });
    }
    return root;
  }

  const openSet = new Set();           // expanded folder paths (survive refresh)
  let activePath = null, rootHandle = null, lastSig = '', refreshing = false;
  const sig = n => (n.type === 'file' ? 'f:' + n.name : 'd:' + n.name + '[' + n.children.map(sig).join(',') + ']');

  function renderNode(node, depth, parent, parentPath) {
    const path = parentPath + '/' + node.name;
    const row = document.createElement('div');
    row.className = 'row';
    row.style.paddingLeft = (6 + depth * 12) + 'px';
    const chev = document.createElement('span'); chev.className = 'chev';
    const ico = document.createElement('span'); ico.className = 'ico';
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = node.name;
    row.title = node.name;
    row.append(chev, ico, lbl);
    parent.appendChild(row);

    if (node.type === 'dir') {
      chev.textContent = '▶';
      const box = document.createElement('div');
      parent.appendChild(box);
      node.children.forEach(c => renderNode(c, depth + 1, box, path));
      const setOpen = o => { row.classList.toggle('open', o); box.style.display = o ? '' : 'none'; ico.textContent = o ? '📂' : '📁'; };
      setOpen(openSet.has(path));
      row.onclick = () => {
        const o = !row.classList.contains('open');
        setOpen(o);
        if (o) openSet.add(path); else openSet.delete(path);
      };
    } else {
      ico.textContent = '📝';
      if (path === activePath) { row.classList.add('active'); activeRow = row; }
      row.onclick = () => { activePath = path; showFile(node.getFile, node.name, row); };
    }
    return row;
  }

  function paintTree(root) {
    sortNodes(root.children);
    lastSig = sig(root);
    activeRow = null;
    tree.innerHTML = '';
    $('exp-title').textContent = root.name;
    if (!root.children.length) tree.innerHTML = '<div class="empty">No Markdown files found in this folder.</div>';
    else root.children.forEach(c => renderNode(c, 0, tree, root.name));
  }

  function showTree(root) {
    openSet.clear(); activePath = null;
    paintTree(root);
    toggleExplorer(true);
  }

  // re-scan the opened folder; only redraw when something actually changed
  async function refreshTree(force) {
    if (!rootHandle || refreshing) return;
    refreshing = true;
    try {
      const root = await scanHandle(rootHandle);
      sortNodes(root.children);
      if (force || sig(root) !== lastSig) {
        const st = tree.scrollTop;
        paintTree(root);
        tree.scrollTop = st;
      }
    } catch (e) { /* folder moved or permission lost: keep the old tree */ }
    finally { refreshing = false; }
  }
  $('b-refresh').onclick = () => refreshTree(true);
  window.addEventListener('focus', () => refreshTree());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshTree(); });
  setInterval(() => { if (!document.hidden) refreshTree(); }, 3000);

  function emptyTree() {
    tree.innerHTML = '<div class="empty">No folder opened.<br><br><a id="e-open">Open folder</a></div>';
    $('e-open').onclick = openFolder;
  }
  emptyTree();

  /* ================= opening things ================= */
  async function openFolder() {
    if (window.showDirectoryPicker) {
      try {
        const h = await window.showDirectoryPicker({ mode: 'read' });
        tree.innerHTML = '<div class="empty">Scanning…</div>';
        rootHandle = h; showTree(await scanHandle(h));
      } catch (e) { if (e.name !== 'AbortError') dirFallback.click(); else emptyTreeIfNone(); }
    } else {
      dirFallback.click();
    }
  }
  function emptyTreeIfNone() { if (!tree.querySelector('.row') && !tree.querySelector('.empty')) emptyTree(); else if (tree.textContent === 'Scanning…') emptyTree(); }

  async function openFile() {
    if (window.showOpenFilePicker) {
      try {
        const [h] = await window.showOpenFilePicker({
          types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkd'], 'text/plain': ['.txt'] } }]
        });
        showFile(() => h.getFile(), h.name, null);
      } catch (e) { if (e.name !== 'AbortError') fileInput.click(); }
    } else fileInput.click();
  }

  $('b-folder').onclick = openFolder;
  $('b-file').onclick = openFile;
  fileInput.onchange = e => { const f = e.target.files[0]; if (f) showFile(async () => f, f.name, null); fileInput.value = ''; };
  dirFallback.onchange = e => { if (e.target.files.length) { rootHandle = null; showTree(buildFromFiles(e.target.files)); } dirFallback.value = ''; };
  drop.onclick = openFile;

  /* ================= drag & drop (files or folders) ================= */
  ['dragenter', 'dragover'].forEach(ev =>
    window.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); }));
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', async e => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const item = e.dataTransfer.items && e.dataTransfer.items[0];
    if (item && item.getAsFileSystemHandle) {
      const h = await item.getAsFileSystemHandle();
      if (h && h.kind === 'directory') { rootHandle = h; showTree(await scanHandle(h)); return; }
      if (h && h.kind === 'file') { showFile(() => h.getFile(), h.name, null); return; }
    }
    const f = e.dataTransfer.files[0];
    if (f) showFile(async () => f, f.name, null);
  });

  window.addEventListener('paste', e => {
    const t = e.clipboardData.getData('text');
    if (t) render(t, 'Pasted markdown');
  });

  /* ================= focus timer ================= */
  const T = {
    down: { target: 30 * 60000, base: 0, start: 0, running: false, done: false },
    up:   { base: 0, start: 0, running: false }
  };
  let tab = 'down', actx = null;
  const elapsed = t => t.base + (t.running ? Date.now() - t.start : 0);
  const value = k => (k === 'down' ? T.down.target - elapsed(T.down) : elapsed(T.up));

  function fmt(ms, mode) {
    ms = Math.max(0, ms);
    const total = mode === 'down' ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? h + ':' + p(m) + ':' + p(s) : p(m) + ':' + p(s);
  }

  function paintTimer() {
    const d = T[tab];
    $('tdisp').textContent = fmt(value(tab), tab);
    $('tdisp').classList.toggle('done', tab === 'down' && T.down.done);
    const started = elapsed(d) > 0 && !(tab === 'down' && T.down.done);
    $('tstart').textContent = d.running ? 'Pause' : (started ? 'Resume' : 'Start');
    const run = T.down.running ? 'down' : (T.up.running ? 'up' : null);
    $('mini').textContent = run ? fmt(value(run), run) : (T.down.done ? '00:00' : '');
    paintFloat();
  }

  function beep() {
    if (!actx) return;
    try {
      [0, 0.35, 0.7].forEach(t => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.frequency.value = 880; g.gain.value = 0.15;
        o.connect(g); g.connect(actx.destination);
        o.start(actx.currentTime + t); o.stop(actx.currentTime + t + 0.22);
      });
    } catch (e) {}
  }

  function resetTimer(k) {
    const d = T[k];
    d.base = 0; d.running = false;
    if (k === 'down') d.done = false;
  }

  let floatOn = false, floatDismissed = false, pip = null;
  const activeKey = () => (T.down.running ? 'down' : T.up.running ? 'up' : tab);

  function toggleKey(k) {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
    const d = T[k];
    if (d.running) { d.base = elapsed(d); d.running = false; }
    else {
      if (k === 'down' && T.down.done) resetTimer('down');
      d.start = Date.now(); d.running = true;
      if (!floatDismissed) floatOn = true;   // floating clock appears when you start
    }
    paintTimer();
  }
  $('tstart').onclick = () => toggleKey(tab);

  function paintFloat() {
    const k = activeKey(), d = T[k];
    const time = fmt(value(k), k);
    const label = k === 'down' ? 'Focus' : 'Stopwatch';
    const play = d.running ? '❚❚' : '▶';
    const done = k === 'down' && T.down.done;
    $('float').classList.toggle('hidden', !floatOn || !!pip);
    $('float').classList.toggle('done', done);
    $('ftime').textContent = time;
    $('flab').textContent = label;
    $('fplay').textContent = play;
    $('tfloat').textContent = floatOn ? 'Hide floating' : 'Floating';
    if (pip) {
      pip.time.textContent = time; pip.lab.textContent = label; pip.play.textContent = play;
      pip.time.style.color = done ? '#ef6a5b' : '';
    }
  }

  $('fplay').onclick = () => toggleKey(activeKey());
  $('fx').onclick = () => { floatOn = false; floatDismissed = true; paintFloat(); };
  $('tfloat').onclick = () => { floatOn = !floatOn; floatDismissed = !floatOn; paintFloat(); };

  // drag the floating clock anywhere
  (() => {
    const f = $('float');
    let dx = 0, dy = 0, drag = false;
    f.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      const r = f.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top; drag = true;
      f.setPointerCapture(e.pointerId); f.style.cursor = 'grabbing';
    });
    f.addEventListener('pointermove', e => {
      if (!drag) return;
      f.style.left = Math.min(innerWidth - f.offsetWidth, Math.max(0, e.clientX - dx)) + 'px';
      f.style.top = Math.min(innerHeight - f.offsetHeight, Math.max(0, e.clientY - dy)) + 'px';
      f.style.right = 'auto';
    });
    f.addEventListener('pointerup', () => { drag = false; f.style.cursor = 'grab'; });
  })();

  // pop out into a real always-on-top window (Chrome / Edge 116+)
  async function popOut() {
    if (!window.documentPictureInPicture) { alert('Pop-out needs Chrome or Edge (version 116+).'); return; }
    if (pip) { pip.win.close(); return; }
    try {
      const w = await documentPictureInPicture.requestWindow({ width: 260, height: 130 });
      const cs = getComputedStyle(document.documentElement);
      const v = n => cs.getPropertyValue(n).trim();
      w.document.body.style.cssText =
        'margin:0;height:100vh;display:flex;align-items:center;justify-content:center;gap:14px;' +
        'background:' + v('--panel') + ';color:' + v('--text') + ';font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
      const mk = (tag, css, txt) => { const e = w.document.createElement(tag); e.style.cssText = css; if (txt) e.textContent = txt; return e; };
      const box = mk('div', 'text-align:center');
      const lab = mk('div', 'font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:' + v('--muted'));
      const time = mk('div', 'font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1');
      box.append(lab, time);
      const bs = 'width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;font-size:13px;background:' + v('--active') + ';color:' + v('--text');
      const play = mk('button', bs);
      const reset = mk('button', bs, '↺');
      play.onclick = () => toggleKey(activeKey());
      reset.onclick = () => { resetTimer(activeKey()); paintTimer(); };
      const col = mk('div', 'display:flex;flex-direction:column;gap:8px');
      col.append(play, reset);
      w.document.body.append(box, col);
      pip = { win: w, time, lab, play };
      w.addEventListener('pagehide', () => { pip = null; paintFloat(); });
      paintFloat();
    } catch (e) {}
  }
  $('fpop').onclick = popOut;
  $('treset').onclick = () => { resetTimer(tab); paintTimer(); };

  function setTab(k) {
    tab = k;
    $('tab-down').classList.toggle('on', k === 'down');
    $('tab-up').classList.toggle('on', k === 'up');
    $('cdtools').style.display = k === 'down' ? '' : 'none';
    paintTimer();
  }
  $('tab-down').onclick = () => setTab('down');
  $('tab-up').onclick = () => setTab('up');

  function setTarget(min) {
    if (!(min > 0)) return;
    T.down.target = Math.round(min * 60000);
    resetTimer('down');
    document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', +b.dataset.m === min));
    paintTimer();
  }
  document.querySelectorAll('#chips button').forEach(b => (b.onclick = () => setTarget(+b.dataset.m)));
  $('cset').onclick = () => { setTarget(Math.min(600, +$('cmin').value)); };
  $('cmin').addEventListener('keydown', e => { if (e.key === 'Enter') $('cset').click(); });

  $('b-timer').onclick = () => $('timerpanel').classList.toggle('hidden');

  setInterval(() => {
    if (T.down.running && value('down') <= 0) {
      T.down.running = false; T.down.base = T.down.target; T.down.done = true;
      beep();
    }
    paintTimer();
  }, 200);
  paintTimer();

  /* ================= shortcuts ================= */
  /* ================= custom zoom (works in fullscreen) ================= */
  let zoom = 1;
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;right:16px;bottom:16px;padding:6px 12px;border-radius:8px;' +
    'background:var(--panel);color:var(--text);border:1px solid var(--border);font-size:13px;' +
    'opacity:0;transition:opacity .2s;pointer-events:none;z-index:10';
  document.body.appendChild(toast);
  let toastTimer;
  function setZoom(z) {
    zoom = Math.min(3, Math.max(0.5, z));
    out.style.zoom = zoom;
    toast.textContent = Math.round(zoom * 100) + '%';
    toast.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (toast.style.opacity = 0), 900);
  }
  // trackpad pinch (and Ctrl + mouse wheel) arrive as wheel events with ctrlKey
  window.addEventListener('wheel', e => {
    if (!document.fullscreenElement || !e.ctrlKey) return;
    e.preventDefault();
    setZoom(zoom * Math.exp(-e.deltaY * 0.01));
  }, { passive: false });
  // leaving fullscreen hands zoom back to the browser
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && zoom !== 1) { zoom = 1; out.style.zoom = ''; }
  });

  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (document.fullscreenElement && (k === '+' || k === '=')) { e.preventDefault(); setZoom(zoom * 1.1); }
    else if (document.fullscreenElement && (k === '-' || k === '_')) { e.preventDefault(); setZoom(zoom / 1.1); }
    else if (document.fullscreenElement && k === '0') { e.preventDefault(); setZoom(1); }
    else if (k === 'b') { e.preventDefault(); toggleExplorer(); }
    else if (k === 'o') { e.preventDefault(); e.shiftKey ? openFolder() : openFile(); }
  });
</script>
</body>
</html>
