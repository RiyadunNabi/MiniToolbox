<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --bg: #1f1f1e;
    --panel: #262625;
    --text: #e8e6e1;
    --muted: #9a9892;
    --border: #3a3a38;
    --link: #7ab7ff;
    --code-bg: #282c34;
    --inline-code: #f0a98a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.7 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 16px; background: rgba(31,31,30,.92);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
  }
  #bar .name { color: var(--muted); font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #30302e; }
  button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  #drop {
    margin: 12vh auto 0; max-width: 520px; padding: 48px 24px; text-align: center;
    border: 2px dashed var(--border); border-radius: 16px; color: var(--muted);
  }
  #drop strong { color: var(--text); display: block; font-size: 20px; margin-bottom: 8px; }
  body.dragging #drop { border-color: var(--link); color: var(--text); }
  body.dragging { outline: 3px dashed var(--link); outline-offset: -10px; }

  #out { max-width: 780px; margin: 0 auto; padding: 32px 20px 120px; display: none; }
  #out h1, #out h2, #out h3, #out h4 { line-height: 1.3; margin: 1.6em 0 .5em; font-weight: 650; }
  #out h1 { font-size: 2em; border-bottom: 1px solid var(--border); padding-bottom: .3em; margin-top: .6em; }
  #out h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  #out h3 { font-size: 1.2em; }
  #out p, #out ul, #out ol, #out blockquote, #out table, #out pre { margin: 0 0 1em; }
  #out a { color: var(--link); text-decoration: none; }
  #out a:hover { text-decoration: underline; }
  #out ul, #out ol { padding-left: 1.6em; }
  #out li { margin: .25em 0; }
  #out blockquote {
    border-left: 3px solid var(--border); padding: 2px 16px; color: var(--muted);
  }
  #out hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  #out img { max-width: 100%; border-radius: 8px; }

  #out code {
    font: 0.88em/1.5 ui-monospace, "SF Mono", Consolas, "Cascadia Code", Menlo, monospace;
  }
  #out :not(pre) > code {
    background: #333331; color: var(--inline-code);
    padding: .15em .4em; border-radius: 6px;
  }
  .codewrap { position: relative; margin: 0 0 1em; border-radius: 10px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); }
  .codewrap .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: #21252b; color: var(--muted);
    font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .codewrap .head button { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  .codewrap pre { margin: 0; overflow-x: auto; }
  .codewrap pre code.hljs { background: transparent; padding: 14px 16px; display: block; }

  #out table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
  #out th, #out td { border: 1px solid var(--border); padding: 8px 12px; }
  #out th { background: var(--panel); text-align: left; }
  #out tr:nth-child(even) td { background: rgba(255,255,255,.02); }
  #out input[type=checkbox] { margin-right: 6px; }
</style>
</head>
<body>
  <div id="bar">
    <span class="name" id="fname">No file loaded</span>
    <button id="open">Open .md</button>
    <input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  </div>

  <div id="drop">
    <strong>Drop a .md file here</strong>
    or click "Open .md" up top. You can also paste markdown with Ctrl+V.
  </div>

  <article id="out"></article>

<script>
  const out = document.getElementById('out');
  const drop = document.getElementById('drop');
  const fname = document.getElementById('fname');
  const fileInput = document.getElementById('file');

  marked.setOptions({ gfm: true, breaks: false });

  // Pull math out before marked (so _ * \\ don't get mangled), skip code
  const MATH_RE = new RegExp(
    '(```[\\s\\S]*?```|~~~[\\s\\S]*?~~~|`[^`\\n]*`)' +                 // 1 code (skip)
    '|\\$\\$([\\s\\S]+?)\\$\\$' +                                       // 2 $$ display
    '|\\\\\\[([\\s\\S]+?)\\\\\\]' +                                     // 3 \[ display
    '|(\\\\begin\\{(align\\*?|aligned|equation\\*?|gather\\*?|cases|array|[pbvBV]?matrix)\\}[\\s\\S]+?\\\\end\\{\\5\\})' + // 4 bare env
    '|\\\\\\(([\\s\\S]+?)\\\\\\)' +                                     // 6 \( inline
    '|\\$(?!\\s)((?:\\\\.|[^$\\\\\\n])+?)(?<!\\s)\\$(?!\\d)',           // 7 $ inline
    'g'
  );

  function extractMath(text) {
    const store = [];
    const stash = (tex, display) => {
      store.push({ tex, display });
      return 'MATHPH' + (store.length - 1) + 'X';
    };
    const replaced = text.replace(MATH_RE, (m, code, dd, br, env, _e, par, inl) => {
      if (code) return m;
      if (dd !== undefined) return stash(dd, true);
      if (br !== undefined) return stash(br, true);
      if (env !== undefined) return stash(env, true);
      if (par !== undefined) return stash(par, false);
      if (inl !== undefined) return stash(inl, false);
      return m;
    });
    return { replaced, store };
  }

  function restoreMath(html, store) {
    return html.replace(/MATHPH(\d+)X/g, (m, i) => {
      const item = store[+i];
      if (!item) return m;
      try {
        return katex.renderToString(item.tex.trim(), {
          displayMode: item.display, throwOnError: false, strict: 'ignore'
        });
      } catch (e) {
        return '<code>' + item.tex.replace(/</g, '&lt;') + '</code>';
      }
    });
  }

  function render(text, name) {
    const { replaced, store } = extractMath(text);
    const html = restoreMath(marked.parse(replaced), store);
    out.innerHTML = html;

    // wrap code blocks with header + copy button, then highlight
    out.querySelectorAll('pre > code').forEach(code => {
      const pre = code.parentElement;
      const langClass = [...code.classList].find(c => c.startsWith('language-'));
      const lang = langClass ? langClass.replace('language-', '') : 'text';
      if (hljs.getLanguage(lang)) {
        hljs.highlightElement(code);
      } else {
        code.classList.add('hljs');
      }
      const wrap = document.createElement('div');
      wrap.className = 'codewrap';
      const head = document.createElement('div');
      head.className = 'head';
      const label = document.createElement('span');
      label.textContent = lang;
      const btn = document.createElement('button');
      btn.textContent = 'Copy';
      btn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code.innerText);
          btn.textContent = 'Copied';
        } catch (e) {
          btn.textContent = 'Failed';
        }
        setTimeout(() => (btn.textContent = 'Copy'), 1500);
      });
      head.append(label, btn);
      pre.replaceWith(wrap);
      wrap.append(head, pre);
    });

    // open links in new tab
    out.querySelectorAll('a[href^="http"]').forEach(a => {
      a.target = '_blank'; a.rel = 'noopener noreferrer';
    });

    drop.style.display = 'none';
    out.style.display = 'block';
    fname.textContent = name || 'Pasted markdown';
    document.title = name || 'MD Viewer';
    window.scrollTo(0, 0);
  }

  function loadFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => render(r.result, file.name);
    r.readAsText(file);
  }

  document.getElementById('open').onclick = () => fileInput.click();
  drop.onclick = () => fileInput.click();
  fileInput.onchange = e => loadFile(e.target.files[0]);

  ['dragenter', 'dragover'].forEach(ev =>
    window.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add('dragging'); }));
  ['dragleave', 'drop'].forEach(ev =>
    window.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove('dragging'); }));
  window.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

  window.addEventListener('paste', e => {
    const t = e.clipboardData.getData('text');
    if (t) render(t, 'Pasted markdown');
  });
</script>
</body>
</html>
